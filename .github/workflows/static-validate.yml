name: Static publishing validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static platform
        run: python3 scripts/validate_static.py

      - name: Check planner JavaScript syntax
        run: |
          node --check vault-session.js
          node --check app.js
          node --check qr.js
          node --check sync.js

      - name: Check account JavaScript syntax
        run: node --check account/app.js

      - name: Check Financial Health JavaScript syntax
        run: |
          node --check health/health.js
          node --check health/guide-journey.js
          node --check guide/focus/focus.js

      - name: Check Income Project Lab JavaScript syntax
        run: |
          node --check passive-income/app.js
          node --check passive-income/focus-guard.js
