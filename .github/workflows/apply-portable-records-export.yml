name: Apply portable records export

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_portable_records_export.py
      - .github/workflows/apply-portable-records-export.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_portable_records_export.py

      - name: Validate patched platform
        run: |
          python3 scripts/validate_static.py
          node --check app.js
          node --check passive-income/app.js

      - name: Commit application changes
        run: |
          git config user.name "ShareCapsule automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html README.md PUBLISHING.md SECURITY.md
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Add portable records export for domain migration"
            git push origin HEAD:main
          fi
