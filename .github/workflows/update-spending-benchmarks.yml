name: Update spending benchmarks

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_spending_benchmarks.py
      - .github/workflows/update-spending-benchmarks.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audited BLS regionalized income-quintile benchmark data
        run: python scripts/update_spending_benchmarks.py
      - name: Validate benchmark output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('health/benchmarks.json').read_text())
          assert data['sourcePeriod'] == '2023'
          assert data['benchmarkMethod'] == 'regionalized-income-quintile'
          assert data['isExactCrossTab'] is False
          assert set(data['regions']) == {'northeast','midwest','south','west'}
          for region in data['regions'].values():
              assert len(region['cohorts']) == 5
              previous_max = -1
              for cohort in region['cohorts']:
                  assert cohort['annualExpenditures'] > 0
                  assert cohort['housing'] > 0
                  assert cohort['food'] > 0
                  assert cohort['transportation'] > 0
                  assert cohort['min'] >= 0
                  assert cohort['min'] > previous_max
                  if cohort['max'] is not None:
                      assert cohort['max'] >= cohort['min']
                      previous_max = cohort['max']
          print('Benchmark output validated')
          PY
      - name: Commit regenerated public benchmark data
        run: |
          if git diff --quiet -- health/benchmarks.json && git ls-files --error-unmatch health/benchmarks.json >/dev/null 2>&1; then
            echo "No benchmark changes"
            exit 0
          fi
          git config user.name "sharecapsule-benchmark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add health/benchmarks.json
          git commit -m "Refresh BLS spending benchmarks"
          git push
